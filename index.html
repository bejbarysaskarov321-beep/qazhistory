<style>
/* Layout: navy header band + wide reading column; sections are tabs on topic pages; gold marks progress and primary actions */
:root{
  --bg:#f4f7fc; --surface:#ffffff; --fg:#14203d; --muted:#5a6785; --line:#dde4f0;
  --navy:#0b1f4b; --navy-2:#16306e; --gold:#c9a227; --gold-ink:#7d5f00; --on-gold:#0b1f4b;
  --ok:#17794a; --ok-bg:#e3f4eb; --bad:#b3261e; --bad-bg:#fbe9e7; --hero-fg:#ffffff; --hdr:#ffffff; --hdrfg:#14203d; --blue:#1f4fd8; --onblue:#ffffff;
  --display:"Noto Serif",Georgia,serif; --body:"Noto Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1630; --surface:#12224d; --fg:#eef1f8; --muted:#a6b3d6; --line:#27396c;
  --navy:#07122a; --navy-2:#16306e; --gold:#e0b73a; --gold-ink:#e8c456; --on-gold:#0b1f4b;
  --ok:#5fd39a; --ok-bg:#12382b; --bad:#ff8a80; --bad-bg:#43211f; --hdr:#07122a; --hdrfg:#ffffff; --blue:#6f93ff; --onblue:#07122a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1630; --surface:#12224d; --fg:#eef1f8; --muted:#a6b3d6; --line:#27396c;
  --navy:#07122a; --navy-2:#16306e; --gold:#e0b73a; --gold-ink:#e8c456; --on-gold:#0b1f4b;
  --ok:#5fd39a; --ok-bg:#12382b; --bad:#ff8a80; --bad-bg:#43211f; --hdr:#07122a; --hdrfg:#ffffff; --blue:#6f93ff; --onblue:#07122a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0 0 .5em}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.4rem,3.5vw,2rem);font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0 0 1em;max-width:68ch}
a{color:var(--gold-ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--navy);color:var(--hero-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
.bar{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;letter-spacing:.04em;color:#fff;background:none;border:0;cursor:pointer;font-size:1.1rem;padding:0}
.logo span{color:var(--gold)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
nav button{background:none;border:0;color:#d5def5;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{background:var(--navy-2);color:#fff}
nav button:hover{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--gold);background:var(--gold);color:var(--on-gold);font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.onnavy{background:transparent;color:#fff;border-color:#5b73b5}
.btn.sm{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hero{background:var(--navy);color:var(--hero-fg);padding-block:48px 40px}
.hero p{color:#cdd8f3;font-size:1.1rem}
.hero h1 em{font-style:normal;color:var(--gold)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.strip{display:flex;gap:0;overflow-x:auto;margin-top:32px;border-top:1px solid #2c4283;padding-top:16px}
.strip div{flex:0 0 auto;padding-right:28px;margin-right:28px;border-right:1px solid #2c4283;min-width:0}
.strip div:last-child{border:0}
.strip b{display:block;font-family:var(--display);color:var(--gold);font-size:1.3rem}
.strip small{color:#b9c6e8}
main{padding-block:32px 64px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card.link{cursor:pointer;text-align:left;width:100%;display:block}
.card.link:hover{border-color:var(--gold)}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--gold-ink)}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:.8rem}
.pill.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.bar-track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--gold)}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-block:20px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--gold);font-weight:700}
.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--gold)}
.tl li{padding:0 0 16px 18px;position:relative}
.tl li::before{content:"";position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:3px solid var(--gold)}
.tl b{font-family:var(--display)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
th{background:var(--surface)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.note{border-left:4px solid var(--gold);background:var(--surface);padding:12px 16px;border-radius:0 10px 10px 0;margin-block:16px;max-width:72ch}
label{display:block;font-weight:500;margin-bottom:12px}
input,select{display:block;width:100%;margin-top:4px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.form{max-width:440px}
.err{color:var(--bad);font-weight:500}
.crumbs{margin-bottom:16px}
.crumbs button{background:none;border:0;color:var(--gold-ink);cursor:pointer;padding:0;text-decoration:underline}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-block:12px}
.chip{border:2px solid var(--line);background:var(--bg);padding:4px 14px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:var(--on-gold);font-weight:700}
.score{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--gold-ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.bar-fill{transition:width .4s}}

.rd .wrap{max-width:1200px}
.rd-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:12px}
.rd-body{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.rd-side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:80vh;overflow:auto;min-width:0}
.toc-i{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer;color:var(--fg)}
.toc-i.cur{color:var(--gold-ink);font-weight:700}
.toc-i small{color:var(--muted);white-space:nowrap}
.paper{--paper:#ffffff;--paper-ink:#1d2433;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.18);min-width:0}
.paper-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid #d9dde8;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:#4f5f86}
.paper-b{padding:24px;line-height:1.75;font-family:var(--display);font-weight:600;min-height:50vh}
.paper-b p{max-width:none;text-indent:1.5em;margin:0 0 .8em;font-weight:400}
.paper-b .muted{color:#4f5f86;text-indent:0}
.paper-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 24px;border-top:1px solid #d9dde8}
.paper-f input{background:#fff;color:#1d2433;border-color:#c5ccdf}
.books{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.book{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.cover{flex:0 0 96px}
.cover img{width:96px;height:auto;border-radius:6px;border:1px solid var(--line);display:block}
.cover-ph{width:96px;aspect-ratio:3/4;background:var(--navy);color:#fff;border-radius:6px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-size:.7rem;overflow:hidden}
.cover-ph span{color:var(--gold);font-family:var(--display);font-size:1.6rem;font-weight:800}
.bmeta{min-width:0;flex:1}
.bmeta h3{font-size:1rem}
textarea:focus-visible{outline:3px solid var(--gold)}
@media (max-width:800px){.rd-body{grid-template-columns:minmax(0,1fr)}.rd-side{display:none}.rd-side.open{display:block}.paper-b,.paper-f,.paper-h{padding-inline:16px}}
/* library redesign */
.lib{padding-block:24px 64px}
.lib-hero{background:linear-gradient(125deg,var(--navy),var(--navy-2));color:#fff;border-radius:20px;padding:30px;margin-bottom:8px;border-bottom:4px solid var(--gold)}
.lib-hero h1{font-size:clamp(1.7rem,4vw,2.5rem);margin:0 0 10px;color:#fff}
.lib-hero p{color:#d5def5;max-width:60ch;margin:0}
.lstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.lstats span{border:1px solid #5b73b5;border-radius:10px;padding:5px 12px;font-size:.85rem;color:#e6ecfb}
.section-head{margin:26px 0 12px}.section-head h2{margin:0;font-size:1.4rem}.section-head p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.grade-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.grade{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;color:var(--fg)}
.grade:hover,.grade.active{border-color:var(--gold);box-shadow:0 4px 16px rgba(201,162,39,.2)}
.grade.active{background:var(--bg);border-width:2px}
.grade .num{width:42px;height:42px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;margin:0 auto 8px;font-family:var(--display);font-weight:800;font-size:1.2rem}
.grade strong{display:block;font-size:.9rem}.grade small{color:var(--muted)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 0}
.toolbar .search{flex:1;min-width:210px}.toolbar input,.toolbar select{margin:0}.toolbar select{width:auto;min-width:160px}
.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.book{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:170px}
.cover{flex:0 0 84px;width:84px}
.cover img{width:84px;height:112px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.cover-ph{width:84px;height:112px;border-radius:8px;background:linear-gradient(145deg,var(--navy),#2b4aa0);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:10px;font-size:.62rem;font-weight:700;letter-spacing:.04em;box-shadow:0 5px 12px rgba(11,31,75,.25)}
.cover-ph span{font-family:var(--body);font-size:.62rem;font-weight:700;line-height:1.3;color:#fff}
.cover-ph span:first-child{color:var(--gold)}
.cover-ph.world{background:linear-gradient(145deg,#0f5547,#3f9b80)}
.book-info{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;flex:1}
.btag{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:2px 9px}
.book h3{font-size:1rem;line-height:1.3;margin:2px 0}.book p{font-size:.82rem;color:var(--muted);margin:0}
.book .btn{margin-top:auto}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:16px;padding:30px;text-align:center;color:var(--muted)}
/* reader redesign */
.rd-card{background:#fff;color:#1d2433;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25);margin-block:16px}
.rd-top{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.rd-top h2{font-size:1.1rem;margin:0;color:#fff}.rd-top p{font-size:.78rem;color:#c7d3f5;margin:3px 0 0}
.rd-ctl{display:flex;gap:8px;flex-wrap:wrap}
.rd-ctl button{background:#2b3d68;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer}
.rd-ctl button:hover{background:#3a4f82}
.rd-prog{height:4px;background:#dce5ff}.rd-prog span{display:block;height:100%;background:var(--gold)}
.rd-card .rd-body{grid-template-columns:260px minmax(0,1fr);gap:0;min-height:70vh}
.rd-card .rd-side{background:#f6f8fc;border:0;border-right:1px solid #e1e7f0;border-radius:0;max-height:none;padding:18px;color:#1d2433}
.rd-side h3{font-family:var(--body);font-size:.8rem;letter-spacing:.08em;margin:0 0 10px;color:#4f5f86}
.rd-card .toc-i{color:#45516b;border-bottom:0;border-radius:10px;padding:10px}
.rd-card .toc-i:hover,.rd-card .toc-i.cur{background:#e8eeff;color:#1f43ae}
.rd-card .toc-i small{color:#65718a}
.rd-card .chip{background:#fff;color:#1d2433;border-color:#d3dbec}
.rd-card .chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#0b1f4b}
.rd-card .rd-side input{background:#fff;color:#1d2433;border-color:#d3dbec}
.page{padding:clamp(18px,4vw,44px);min-width:0;max-width:820px}
.page .eyebrow{color:#2348b8;font-weight:800;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.page .paper-b{padding:0;min-height:40vh;font-family:var(--display);color:#38445a}
.page .paper-b p{color:#38445a}
.rd-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.rd-act .btn.ghost{color:#1d2433;border-color:#d3dbec}
.rd-act .pill{background:#eef3ff;color:#1f43ae;border-color:#d3dbec}
.rd-tocbtn{display:none}
.page-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:30px;border-top:1px solid #e1e7f0;padding-top:16px;flex-wrap:wrap}
.page-nav input{background:#fff;color:#1d2433;border-color:#c5ccdf}
.page-nav .timer{color:#65718a}
@media (max-width:900px){.grade-grid{grid-template-columns:repeat(3,1fr)}.books{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:800px){.rd-card .rd-body{grid-template-columns:minmax(0,1fr)}.rd-card .rd-side{display:none;border-right:0;border-bottom:1px solid #e1e7f0}.rd-card .rd-side.open{display:block}.rd-tocbtn{display:inline-flex}}
@media (max-width:600px){.books{grid-template-columns:1fr}.grade-grid{grid-template-columns:repeat(2,1fr)}.lib-hero{padding:22px}}
/* ubt countdown */
.cd{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-bottom:4px solid var(--gold)}
.cd-in{padding-block:28px;display:grid;gap:18px;text-align:center}
.cd .eyebrow-g{justify-self:center}
.cd h2{color:#fff;margin:0;font-size:clamp(1.25rem,4vw,1.9rem)}
.cd-days{font-family:var(--display);font-weight:800;font-size:clamp(4rem,18vw,8rem);line-height:1;color:var(--gold)}
.cd-days small{display:block;font-family:var(--body);font-weight:500;font-size:1rem;color:#d5def5;margin-top:4px}
.cd-t{display:grid;grid-template-columns:repeat(3,minmax(0,92px));gap:10px;justify-content:center}
.cd-t div{background:rgba(255,255,255,.08);border:1px solid rgba(224,183,58,.45);border-radius:12px;padding:8px 4px;font-size:.8rem;color:#d5def5}
.cd-t b{display:block;font-size:1.6rem;color:#fff;font-variant-numeric:tabular-nums}
.cd-stages{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cd-stages span{border:1px solid rgba(224,183,58,.5);border-radius:999px;padding:5px 12px;font-size:.85rem;color:#eef1f8}
.cd-stages span.cur{background:var(--gold);color:#0b1f4b;border-color:var(--gold);font-weight:600}
.cd-msg{font-size:1.1rem;color:#eef1f8;margin:0}
.cd-push{margin:0;color:#fff;font-weight:600}
.cd .row{justify-content:center}
/* reader comfort */
.rd-ctl button{min-height:44px;padding:8px 14px;font-size:1rem}
.page{max-width:760px;margin-inline:auto}
.page .paper-b p{text-indent:0;margin:0 0 1.1em;font-weight:400;text-align:left;hyphens:auto}
.page-nav{position:sticky;bottom:0;background:#fff;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));z-index:3}
.page-nav .btn{min-height:48px;font-size:1rem;padding-inline:20px}
.page-nav input{font-size:1rem;min-height:44px}
.rd-card.sepia{background:#f4ecd8;color:#3b3226}
.rd-card.sepia .rd-side{background:#ebe1c8;border-color:#d8cba8;color:#3b3226}
.rd-card.sepia .rd-side h3{color:#6b5a3c}
.rd-card.sepia .toc-i{color:#4a3f2c}
.rd-card.sepia .toc-i:hover,.rd-card.sepia .toc-i.cur{background:#dccfa9;color:#5b3d00}
.rd-card.sepia .toc-i small{color:#6b5a3c}
.rd-card.sepia .page .eyebrow{color:#7d5f00}
.rd-card.sepia .page .paper-b,.rd-card.sepia .page .paper-b p{color:#3b3226}

.rd-card.sepia .rd-act .btn.ghost{color:#3b3226;border-color:#cdbf98}
.rd-card.sepia .rd-act .pill{background:#e8dcb8;color:#5b3d00;border-color:#cdbf98}
.rd-card.sepia .chip{background:#fbf6e8;color:#3b3226;border-color:#cdbf98}

.rd-card.night{background:#10182b;color:#e6ebf7}

 full:["XV ғасырда Әбілқайыр ханның қатаң саясатынан бөлінген Керей мен Жәнібек сұлтандар Моғолстанның батыс аймағына (Шу және Қозыбасы өңірі) көшті. 1465–1466 жылдары Қазақ хандығы құрылды.","Қасым хан (1511–1518) хандықты нығайтып, «Қасқа жол» атты заңдар жинағын қолданды. Тәуке хан (1680–1718) тұсында «Жеті жарғы» заңдар жинағы жасалды, билер Төле, Қазыбек және Әйтеке құқықтық жүйеде маңызды рөл атқарды.","Кейін қазақ жүздері қалыптасты: Ұлы, Орта және Кіші жүз. Жоңғар шапқыншылығына қарсы Орбұлақ (1643) және Аңырақай (1730) шайқастары маңызды болды."],

 k:["Абылай хан 1711 жылы туған.","Шын аты — Әбілмансұр.","1771 жылы Орта жүз ханы болып сайланды.","1781 жылы қайтыс болды; Түркістанда жерленген."],
 full:["Абылай хан XVIII ғасырдағы қазақ тарихының ірі қайраткері. Ол Жоңғар хандығына қарсы күресте қолбасшы ретінде танылды, көрші елдермен саяси қатынастарды сақтап отырды.","Оның қасында Бөгенбай, Қабанбай секілді батырлар болды. Билік жүйесінде Бұқар жырау секілді ақылшылар үлкен рөл атқарды.","Жоңғар хандығы 1757–1758 жылдары жойылды. Абылай хан 1781 жылы қайтыс болып, Түркістандағы Қожа Ахмет Ясауи кесенесінің маңына жерленді."],

 k:["Алаш партиясы мен Алашорда 1917 жылы құрылды.","Басшысы: Әлихан Бөкейхан.","Негізгі ұсыныстар: ұлттық автономия, білім, газет, оқулық.","Алашорда 1920 жылы таратылды."],
 full:["XX ғасырдың басында қазақ зиялылары ұлттық мүддені қорғау үшін газет, оқулық және саяси ұйым құрды. Ахмет Байтұрсынұлы, Әлихан Бөкейхан, Міржақып Дулатұлы бұл қозғалыстың көшбасшылары болды.","1913–1918 жылдары «Қазақ» газеті шығып тұрды, редакторы — Ахмет Байтұрсынұлы. Міржақып Дулатұлының «Оян, қазақ!» кітабы 1909 жылы жарық көрді.","1917 жылы Алаш партиясы құрылып, желтоқсанда Алашорда автономиясы жарияланды. Орталығы Семей болды. Алашорда 1920 жылы таратылды, көптеген қайраткер 1930-жылдары қуғын-сүргінге ұшырады."],

["Оғыз мемлекеті: IX–XI ғасырлар, Сырдария бойы.","Билеушісі — жабғу, орталығы — Янгикент.","Қимақ қағанаты: IX–XI ғасырлар, Ертіс бойы.","Қимақ құрамында 7 тайпа болды."],
["Оғыз мемлекеті Сырдарияның орта және төменгі ағысы, Арал және Каспий маңында орналасты. Билеушісі жабғу деп аталды, орталығы Янгикент (Жанкент) болды. Оғыздар Қарахан және Қыпшақ мемлекеттерімен күресті, ал олардың бір бөлігі Селжүктер мемлекетінің негізін қалады.","Қимақ қағанаты Ертіс бойында құрылды. Қимақтардың құрамына жеті тайпа кірді. Билеуші қаған деп аталды. Қимақтар мал өсіріп, жартылай отырықшы өмір сүрді, қалалар мен қыстаулар болды.","Екі мемлекет те Ұлы дала мемлекеттерінің қатарына жатады. Кейін оларды Қыпшақ тайпалары мен Қарахандар сығып шығарды."],

["Қарахан мемлекеті 942 жылы құрылды.","Астанасы — Баласағұн, кейін Қашғар.","Сатұқ Боғра хан исламды қабылдады.","Жүсіп Баласағұн «Құтты білік», Махмұд Қашқари «Диуани лұғат ат-түрк» жазды."],
["Қарахан мемлекеті Қарлұқ, Ягма, Шігіл тайпаларының негізінде Жетісу мен Оңтүстік Қазақстанда құрылды. Билік басында Қара хандар әулеті болды. Қарахан билеушісі Сатұқ Боғра хан исламды қабылдады, бұл ислам дінінің Орталық Азия мен Қазақстанда таралуына әсер етті.","Қарахандар кезінде қалалар мен сауда дамыды, Баласағұн мен Қашғар ірі орталықтар болды. Мәдениет өркендеп, түркі тілінде жазылған көркем және ғылыми шығармалар пайда болды.","Жүсіп Баласағұни «Құтты білік» дастанын (1069–1070), Махмұд Қашқари «Диуани лұғат ат-түрк» сөздігін (1072–1074) жазды. Қожа Ахмет Ясауи «Диуани хикмет» еңбегімен танылды. Мемлекет XI ғасырдың ортасында Шығыс және Батыс бөлікке жіктелді, 1212 жылы Хорезмшах мемлекетінің құрамына енді."],

["1206 жылы Шыңғыс хан Монғол империясын құрды. 1218 жылы Отырарда Хорезмшах билеушісі монғол керуенін тонады, бұл жорыққа сылтау болды. 1219–1221 жылдары монғолдар Қазақстан мен Орта Азияны жаулады.","Отырар қаласы монғолдарға ұзақ қарсылық көрсетті. Қала билеушісі Қайыр хан (Иналшық) бастаған қорғаныс бірнеше ай созылды. Монғол жорығы көптеген қаланы қиратты, егіншілік пен сауда зардап шекті.","Шыңғыс хан империяны ұлдарына бөлді. Жошы ұлысы Қазақстанның көп бөлігін, оның ішінде Дешті Қыпшақты қамтыды. Жошы ұлысынан кейін Алтын Орда қалыптасты."],

["XVII ғасырда Жоңғар хандығы күшейіп, қазақ жеріне жиі шабуыл жасады. Жоңғарлардың 1723 жылғы шабуылы «Ақтабан шұбырынды, Алқакөл сұлама» деп аталатын үлкен қасіретке әкелді. Халық үлкен шығын шекті.","Ауыр жағдайда қазақ жүздері бірігіп, қарсыласуға көшті. Қабанбай, Бөгенбай, Шапырашты Наурызбай секілді батырлар көрінді. 1730 жылы Аңырақай шайқасында қазақ жасағы жоңғарларды жеңді.","XVIII ғасырдың ортасына қарай Цин империясы жоңғарларға соққы берді. 1757–1758 жылдары Жоңғар хандығы жойылды. Қазақтар өз жерінің едәуір бөлігін қайтарып алды."],

["1731 жыл: Кіші жүз Ресей қоластына кіре бастады.","1822 жыл: «Сібір қазақтары туралы жарғы».","1824 жыл: Орынбор жарғысы, Кіші жүздегі хан билігі жойылды.","1867–1868 жж.: Уақытша ережелер."],
["XVIII ғасырда Кіші жүз бен Орта жүздің бір бөлігі жоңғар қаупінен қорғану үшін Ресеймен жақындасты. Қазақ жерінің Ресей құрамына енуі ұзақ жүрді және XIX ғасырдың 60-жылдарына дейін созылды.","1822 жылы Сперанский әзірлеген «Сібір қазақтары туралы жарғы» Орта жүздегі хан билігін жойды. Дала округтерге бөлінді. 1824 жылы Орынбор қазақтары жарғысы Кіші жүзге енгізілді.","1867–1868 жылдары Уақытша ережелер бойынша Қазақстан облыстарға бөлінді: Жетісу мен Сырдария, Орал, Торғай, Ақмола, Семей. Бұл реформалар жергілікті басқаруды патша үкіметіне бағындырды."],

T("uprising",9,"Сырым Датұлы және Исатай–Махамбет көтерілістері",
["Сырым Датұлы көтерілісі: 1783–1797 жж.","Бөкей Ордасы 1801 жылы құрылды.","Исатай Тайманұлы мен Махамбет Өтемісұлы: 1836–1838 жж.","Исатай 1838 жылы қаза тапты."],
["Сырым Датұлы Кіші жүздегі көтеріліс жетекшісі болды. Көтерілістің себебі — жер тарылуы, салық ауыртпалығы және патша шенеуніктерінің озбырлығы. Көтеріліс 1783–1797 жылдары созылды.","1801 жылы Бөкей Ордасы құрылды. Кейін Жәңгір хан тұсында жер тарылып, қазақ шаруалары жағдайы нашарлады. Бұл Исатай Тайманұлы мен Махамбет Өтемісұлы бастаған көтерілістің себебі болды.","1836–1838 жылдары Исатай мен Махамбет халықты бастады. 1838 жылы Ақбұлақ шайқасында Исатай қаза тапты. Махамбет ақын әрі қолбасшы ретінде танылып, 1846 жылы өлтірілді."],

T("kenesary",9,"Кенесары Қасымұлы бастаған көтеріліс",
["Көтеріліс 1837–1847 жылдары болды.","Кенесары — Абылай ханның немересі.","Кенесары 1841 жылы хан болып сайланды.","1847 жылы Кенесары қаза тапты."],
["Кенесары Қасымұлы — Абылай ханның немересі. Ол қазақ мемлекеттігін қалпына келтіру, жерді сақтау мақсатымен 1837 жылы көтеріліс бастады. Көтеріліс Ақмола, Торғай, Көкшетау және басқа өңірлерді қамтыды.","1841 жылы Кенесары хан болып жарияланды. Ол ішкі құрылымды реттеп, салық жүйесін енгізді, әскери жасақ құрды. Оның қасында ұлы Наурызбай мен қарындасы Бопай ханым болды.","Патша әскері көтерілісті басуға ұмтылды. 1847 жылы Кенесары қырғыз манаптарымен қақтығыста тұтқынға түсіп, қаза тапты. Көтеріліс — XIX ғасырдағы ең ірі қарулы қозғалыс."],

T("y1916",9,"1916 жылғы ұлт-азаттық көтеріліс",
["1916 жылы 25 маусымда патша жарлығы шықты.","Тылда жұмысқа 19–43 жас аралығындағы ер адамдар алынуға тиіс болды.","Торғайда көтеріліс басшысы — Амангелді Иманов.","Жетісуда көтеріліс кең өріс алды."],
["Бірінші дүниежүзілік соғыс кезінде патша үкіметі 1916 жылы 25 маусымда жарлық шығарып, қазақ және басқа жергілікті халықтардан 19–43 жас аралығындағы ер адамдарды майдан тылына алуды бұйырды.","Халық бұған қарсы көтерілді. Көтеріліс Торғай, Жетісу, Сырдария, Орал өңірлеріне таралды. Торғайда Амангелді Иманов пен Әліби Жангелдин басты рөл атқарды. Жетісуда Бекболат Әшекеев пен Ұзақ Саурықов көрінді.","Көтеріліс патша әскерінің күшімен басылды. Мыңдаған адам қырылды, көпшілігі Қытайға өтіп кетті. Көтеріліс 1917 жылғы ақпан революциясына дейін созылды."],

["1954 жылы Кеңес үкіметі тың және тыңайған жерлерді игеру науқанын бастады. Қазақстанға көптеген адам келді, миллиондаған гектар жер жыртылды. Нәтижесінде астық көбейді, бірақ топырақ эрозиясы мен экологиялық зардап шекті. Қазақ халқының үлесі азайып, мәдениет пен тіл қысымға ұшырады.","1949 жылы 29 тамызда Семей полигонында алғашқы ядролық сынақ өтті. Көп жыл бойы жүргізілген сынақтар адам денсаулығына және табиғатқа зор зиян келтірді. 1991 жылы 29 тамызда полигон жабылды.","1955 жылы Байқоңырда ғарыш айлағының құрылысы басталды. 1957 жылы 4 қазанда алғашқы жасанды Жер серігі ұшырылды, 1961 жылы 12 сәуірде Юрий Гагарин ғарышқа ұшты."],

T("zheltoqsan",11,"1960–1991 жылдар: Желтоқсан көтерілісі және егемендікке жол",

T("konst",11,"Конституция және мемлекеттік құрылым",
["1993 жыл: алғашқы Конституция.","1995 жыл 30 тамыз: екінші Конституция.","Билік тармақтары: заң шығарушы, атқарушы, сот.","2026 жыл 15 наурыз: жаңа Конституция референдумы."],
["Тәуелсіз Қазақстанның алғашқы Конституциясы 1993 жылы 28 қаңтарда қабылданды. 1995 жылы 30 тамызда республикалық референдумда жаңа Конституция қабылданды, 30 тамыз — Конституция күні болды.","Мемлекеттік билік заң шығарушы, атқарушы және сот тармақтарына бөлінген. 1995 жылғы Конституция бойынша заң шығарушы билік Парламентте болды, ол Сенат пен Мәжілістен тұрды.","2026 жылы 15 наурызда өткен референдумда жаңа Конституция қабылданды, оны дауыс берушілердің 87,15%-ы қолдады деп хабарланды. Ол 2026 жылы 1 шілдеде күшіне енді. Бұл Конституцияда бір палаталы Құрылтай (145 депутат) құрылды, Қазақстан халқы Ассамблеясының орнына Халық кеңесі енгізілді. Оқу барысында ресми көздерден мәліметті тексер."],

{id:"turgesh",grade:7,title:"Түргеш қағанаты",
k:["Түргеш қағанаты 704 жылы құрылды.","Мемлекеттің негізін қалаушы — Үшелік қаған.","Орталығы — Суяб және Талас өңірі, қағанат 756 жылға дейін өмір сүрді.","Түргештер арабтардың басқыншылығына қарсы күрескен."],
full:["Батыс Түрік қағанаты әлсірегеннен кейін Жетісуда түргеш тайпалары күшейді. 704 жылы Үшелік қаған Түргеш қағанатын құрды. Мемлекеттің орталығы Суяб пен Талас өңірі болды.","Түргеш қағанатының белгілі билеушісі Сұлу қаған болды. Ол арабтардың Орта Азияға жасаған жорықтарына қарсы тұрды. Түргештер Қытай мен арабтар арасындағы саяси күресте маңызды рөл атқарды.","Сұлу қаған қайтыс болғаннан кейін (738 ж.) мемлекетте тақ таласы басталды. Қағанат әлсіреп, 756 жылы өз билігін жоғалтты. Түргештердің мұрасын қарлұқтар жалғастырды."],
dates:[["704 ж.","Үшелік қаған Түргеш қағанатын құрды"],["VIII ғ. басы","Арабтар Орта Азияға жорықтарын күшейтті"],["738 ж.","Сұлу қаған қайтыс болды"],["756 ж.","Түргеш қағанаты өз билігін жоғалтты"]],

{id:"karluk",grade:7,title:"Қарлұқ қағанаты",
k:["Қарлұқ қағанаты 756 жылы құрылып, 940 жылға дейін өмір сүрді.","Қарлұқтар Жетісу мен Оңтүстік Қазақстанның бір бөлігін мекендеді.","Қарлұқтардың орталықтарының бірі — Қойлық қаласы.","751 жылғы Талас шайқасында қарлұқтардың қимылы Тан әскерінің жеңілісіне әсер етті."],
full:["Қарлұқтар түрік тайпаларының бірі болып, Алтай мен Жетісу өңірінде қалыптасты. 756 жылы қарлұқ жабғуы Қарлұқ қағанатын құрды. Мемлекеттің территориясы Жетісу мен Оңтүстік Қазақстанды, Шығыс Түркістанның бір бөлігін қамтыды.","751 жылы Талас өзенінің бойында араб әскері мен Тан империясының әскері шайқасты. Шайқаста қарлұқтардың қимылы арабтардың жеңісіне әсер етті. Бұл шайқас Орталық Азиядағы саяси күштердің арақатынасын өзгертті.","Қарлұқтар көшпелі мал шаруашылығымен қатар егіншілікпен, сауда және қолөнермен айналысты. Қойлық сияқты қалалар дамыды. Қағанат кейін Қарахан мемлекетіне ұласты, 940 жылы қарлұқтардың жерлері Қарахан мемлекетінің құрамына енді."],

{id:"whitehorde",grade:8,title:"Ақ Орда",
k:["Ақ Орда — Жошының үлкен ұлы Орда Ежен ұрпақтарының мемлекеті.","Ақ Орда Шығыс Дешті Қыпшақ жерінде орналасты.","Астанасы — Сырдария бойындағы Сығанақ қаласы.","XIV ғасырдың екінші жартысында Орыс хан Ақ Орданы нығайтты."],
full:["Жошы ұлысы Жошының ұлдары Орда мен Бату ұрпақтарының иеліктеріне бөлінді. Бату ұрпақтары билік құрған иелік Алтын Орда, ал Орда Ежен ұрпақтары билік құрған Шығыс Дешті Қыпшақ Ақ Орда деп аталды. Мемлекеттің орталығы Сығанақ қаласы болды.","Ақ Орда халқының негізін қыпшақ, қоңырат, найман, жалайыр сияқты тайпалар құрады. XIV ғасырдың екінші жартысында Орыс хан Ақ Орданы нығайтып, Алтын Орда билеушілерімен күресті.","XIV ғасырдың аяғында Тоқтамыс Ақ Орда мен Алтын Орданы біріктірді. Кейін Ақ Орданың жері мен халқы Қазақ хандығының қалыптасуына негіз болды."],

function reveal(){
  if(!("IntersectionObserver" in window)||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove("pre");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px"});
  document.querySelectorAll(".rv").forEach(el=>{const r=el.getBoundingClientRect();if(r.top>innerHeight*0.92){el.classList.add("pre");io.observe(el)}});
}
/* ---------- ҰБТ countdown (Asia/Almaty-style fixed UTC+5) ---------- */
const TZ="+05:00",DAYMS=864e5;
function ubtStages(){const u=SITE.ubt;const a=u&&Array.isArray(u.stages)?u.stages:[{n:"Жазғы негізгі ҰБТ",s:"",e:""}];return a.map(x=>({n:x.n||"ҰБТ",s:x.s||"",e:x.e||x.s||""}))}
const dayNum=ms=>Math.floor((ms+5*36e5)/DAYMS);
function stState(st,now){
  if(!st.s)return"tbd";
  const a=Date.parse(st.s+"T00:00:00"+TZ),b=Date.parse((st.e||st.s)+"T23:59:59"+TZ);
  if(isNaN(a)||isNaN(b))return"tbd";
  return now<a?"up":now<=b?"live":"past";
}
function ubtPrimary(now){
  const L=ubtStages().map(st=>({st,k:stState(st,now)}));
  return L.find(x=>x.k==="live")||L.filter(x=>x.k==="up").sort((a,b)=>a.st.s<b.st.s?-1:1)[0]||L.find(x=>x.k==="tbd")||L[L.length-1]||null;
}
const fmtD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?m[3]+"."+m[2]+"."+m[1]:""};
function cdHtml(){
  const now=Date.now(),L=ubtStages(),pr=ubtPrimary(now);
  if(!pr)return"";
  const chips=L.map(st=>{const k=stState(st,now),cur=pr.st===st;
    const t=k==="tbd"?"күні жарияланады":fmtD(st.s)+(st.e&&st.e!==st.s?" – "+fmtD(st.e):"");
    return `<span class="${cur?"cur":""}">${esc(st.n)}: ${t}${k==="past"?" · аяқталды":""}</span>`}).join("");
  let main;
  if(pr.k==="up"){
    const d=dayNum(Date.parse(pr.st.s+"T00:00:00"+TZ))-dayNum(now);
    main=`<h2>ҰБТ-ға дейін <span id="cd-n">${d}</span> күн қалды!</h2><p class="cd-msg">${esc(pr.st.n)} · ${fmtD(pr.st.s)}</p>
    <div class="cd-days" aria-hidden="true" id="cd-big">${d}<small>күн</small></div>
    <div class="cd-t" aria-hidden="true"><div><b id="cd-h">--</b>сағат</div><div><b id="cd-m">--</b>минут</div><div><b id="cd-s">--</b>секунд</div></div>`;
  }else if(pr.k==="live")main=`<h2>${esc(pr.st.n)} қазір өтіп жатыр!</h2><p class="cd-msg">Кезең ${fmtD(pr.st.s)}${pr.st.e&&pr.st.e!==pr.st.s?" – "+fmtD(pr.st.e):""} аралығында өтеді. Сәттілік тілейміз!</p>`;
  else if(pr.k==="past")main=`<h2>${esc(pr.st.n)} аяқталды</h2><p class="cd-msg">Бұл кезеңнің мерзімі өтті. Келесі кезеңнің күні жарияланған кезде жаңартылады.</p>`;
  else main=`<h2>${esc(pr.st.n)}: күні әлі белгісіз</h2><p class="cd-msg">ҰБТ күні жарияланған кезде жаңартылады.</p>`;
  return `<section class="cd" aria-label="ҰБТ-ға дейін"><div class="wrap cd-in"><span class="eyebrow-g">ҰБТ-ға дейін</span>${main}
  <div class="cd-stages">${chips}</div>
  <p class="cd-push">Әр күніңді тиімді пайдалан! Бүгінгі сабағыңды оқып, ҰБТ-ға дайындықты жалғастыр!</p>
  <div class="row"><button class="btn lg" data-a="todaylesson">Бүгінгі сабақты бастау</button><button class="btn lg onnavy" data-a="go" data-v="schedule">Оқу жоспарын көру</button></div></div></section>`;
}
function cdTick(){
  const h=$("#cd-h");if(!h||S.view!=="home"){clearInterval(cdTimer);cdTimer=null;return}
  const now=Date.now(),pr=ubtPrimary(now);
  if(!pr||pr.k!=="up"){render();return}
  const a=Date.parse(pr.st.s+"T00:00:00"+TZ),ms=Math.max(0,a-now),d=dayNum(a)-dayNum(now);
  const pad=n=>String(n).padStart(2,"0");
  $("#cd-h").textContent=pad(Math.floor(ms/36e5)%24);$("#cd-m").textContent=pad(Math.floor(ms/6e4)%60);$("#cd-s").textContent=pad(Math.floor(ms/1e3)%60);
  const n=$("#cd-n"),b=$("#cd-big");if(n&&n.textContent!==String(d)){n.textContent=d;if(b)b.firstChild.textContent=d}
}
function startCd(){clearInterval(cdTimer);cdTimer=null;if($("#cd-h")){cdTick();cdTimer=setInterval(cdTick,1000)}}
function currentLessonId(){
  const list=weeksFor();
  for(let i=0;i<list.length;i++){
    if(!weekUnlocked(list,i))break;
    const w=list[i];
    for(let j=0;j<w.topics.length;j++){const id=w.topics[j];if(!lesDone(id))return lessonUnlocked(list,i,j)?id:null}
    if(!wkRes(w.key).passed){S.sch.i=i;return null}
  }
  return null;
}

/* ---------- tests ---------- */
function build(qs){return qs.map(x=>{const opts=shuffle([x.c].concat(x.w));return{q:x.q,opts,ci:opts.indexOf(x.c),e:x.e,l:x.l,tid:x.tid}})}
function pool(ids,lvl){return TOPICS.filter(t=>!ids||ids.includes(t.id)).flatMap(t=>t.q.map(a=>({q:a[0],c:a[1],w:a[2],e:a[3],l:a[4],tid:t.id}))).filter(x=>!lvl||x.l===lvl)}
function startTest(cfg){stopTimer();S.T={...cfg,qs:build(cfg.qs),i:0,ans:[],pts:0,picked:null,left:20};S.view="test";vQ()}
function vQ(){
  const T=S.T;stopTimer();
  if(T.i>=T.qs.length){return vResult()}
  const x=T.qs[T.i],p=T.picked;
  out(`<main class="wrap"><p class="crumbs"><button data-a="quit">Тесттен шығу</button> · ${esc(T.title)}</p>
  <div class="row" style="justify-content:space-between"><span class="tag">Сұрақ ${T.i+1} / ${T.qs.length}</span>${T.timed?`<span class="timer" id="tm">${T.left} с</span>`:""}<span class="pill">Ұпай: ${T.pts}</span></div>
  <div class="bar-track" style="margin-block:12px"><div class="bar-fill" style="width:${T.i/T.qs.length*100}%"></div></div>
  <h2 style="font-size:1.4rem">${esc(x.q)}</h2>
  ${x.opts.map((o,i)=>`<button class="opt ${p!==null?(i===x.ci?"ok":i===p?"bad":""):""}" data-a="pick" data-i="${i}" ${p!==null?"disabled":""}>${esc(o)}</button>`).join("")}
  ${p!==null?`<div class="note"><b>${p===x.ci?"Дұрыс.":(p===-1?"Уақыт бітті.":"Қате.")}</b> ${esc(x.e)}</div><button class="btn" data-a="next">${T.i+1>=T.qs.length?"Нәтижені көру":"Келесі"}</button>`:""}</main>`);
  if(T.timed&&p===null){S.timer=setInterval(()=>{T.left--;const el=$("#tm");if(el)el.textContent=T.left+" с";if(T.left<=0){stopTimer();pick(-1)}},1000)}
}
function pick(i){
  const T=S.T,x=T.qs[T.i];if(T.picked!==null)return;
  stopTimer();T.picked=i;const ok=i===x.ci;
  T.ans.push({ok,tid:x.tid,l:x.l,q:x.q,right:x.opts[x.ci],given:i>=0?x.opts[i]:"—",e:x.e});
  if(ok){T.pts+=10+(T.timed?Math.max(0,Math.ceil(T.left/4)):0)}
  vQ();
}
function vResult(){
  const T=S.T,s=T.ans.filter(a=>a.ok).length,n=T.qs.length,pct=Math.round(s/n*100);
  if(!T.saved){
    T.saved=true;

    P.mist=P.mist||{};T.ans.forEach(a=>{const k=a.q.slice(0,90);if(a.ok){delete P.mist[k]}else{const x=T.qs.find(z=>z.q===a.q);if(x)P.mist[k]={q:a.q,c:a.right,w:x.opts.filter((_,i)=>i!==x.ci),e:a.e,l:a.l,tid:a.tid,n:((P.mist[k]||{}).n||0)+1,t:Date.now()}}});
    {const ks=Object.keys(P.mist);if(ks.length>150)ks.sort((a,b)=>P.mist[a].t-P.mist[b].t).slice(0,ks.length-150).forEach(k=>delete P.mist[k])}
    P.points+=T.pts;
    P.tests=P.tests.concat({d:new Date().toLocaleDateString("kk-KZ"),title:T.title,s,t:n}).slice(-40);
    T.ans.forEach(a=>{const st=P.stat[a.tid]=P.stat[a.tid]||{s:0,t:0};st.t++;if(a.ok)st.s++;
      if(!a.ok&&!P.wrong.some(w=>w.q===a.q))P.wrong.push({q:a.q,right:a.right,e:a.e,tid:a.tid});
      if(a.ok)P.wrong=P.wrong.filter(w=>w.q!==a.q)});
    P.wrong=P.wrong.slice(-40);
    if(T.mode==="week")saveWeek(T,pct);
    if(T.wkq){P.wkq=P.wkq||{};P.wkq[T.wkq]=Math.max(P.wkq[T.wkq]||0,pct)}

    ${weak.length?`<h3>Алдымен қайталайтын тақырыптар</h3><div class="row">${weak.map(id=>`<button class="btn ghost sm" data-a="lesson" data-t="${id}">${esc(TOPIC[id].title)} — ${by[id][0]}/${by[id][1]}</button>`).join("")}</div>`:""}

  }

    ${weak.length?`<h3>Қайталайтын тақырыптар</h3><div class="row">${weak.map(id=>`<button class="btn ghost sm" data-a="lesson" data-t="${id}">${esc(TOPIC[id].title)} — ${by[id][0]}/${by[id][1]}</button>`).join("")}</div>`:""}
    <div class="row" style="margin-top:12px"><button class="btn" data-a="go" data-v="schedule">ҰБТ оқу жоспарына оралу</button></div>`;

/* ---------- reader ---------- */
function chapterAt(b,p){let r=null;(b.chapters||[]).forEach((c,i)=>{if(c.p<=p)r={...c,i}});return r}
function chapterEnd(b,i){const cs=b.chapters;return i+1<cs.length?cs[i+1].p-1:b.pages}
async function loadPages(id){
  if(CH[id])return;
  const b=bookById(id);const arr=new Array(b.pages).fill("");
  const snap=await DB.collection("bookpages").where("book","==",id).get();
  snap.docs.forEach(d=>{const x=d.data();(x.pages||[]).forEach((t,i)=>{const idx=x.k*CHUNK+i;if(idx<arr.length)arr[idx]=t})});
  CH[id]=arr;
}
async function openBook(id,page){
  const b=bookById(id);if(!b||!DB)return;
  const rp=P.read[id]||{};
  const rs=P.rset||{};
  S.R={id,page:1,toc:false,side:"toc",mode:b.scanned?"orig":"text",font:rp.font||20,theme:rs.theme||(rs.night?"night":"day"),ff:rs.ff||"serif",lh:rs.lh||1.85,q:"",res:null,loading:true,err:"",tok:0};
  S.view="reader";vReader();
  try{await loadPages(id)}catch(e){S.R.err="Беттерді жүктеу мүмкін болмады."}
  S.R.loading=false;
  S.R.page=clamp(page||rp.page||1,1,b.pages);
  track();vReader();
}
function track(){
  const R=S.R,b=bookById(R.id);if(!b)return;
  const rp=P.read[R.id]=P.read[R.id]||{page:1,max:1,ch:{},font:18};
  rp.page=R.page;rp.max=Math.max(rp.max||1,R.page);rp.font=R.font;rp.ch=rp.ch||{};rp.t=Date.now();
  P.rset={theme:R.theme,ff:R.ff,night:R.theme==="night",lh:R.lh||1.85};
  const c=chapterAt(b,R.page);
  if(c&&R.page>=chapterEnd(b,c.i))rp.ch[c.i]=true;
  saveP();
}
function vReader(){
  const R=S.R,b=bookById(R.id);if(!b){go("library");return}
  const rp=P.read[R.id]||{},ch=chapterAt(b,R.page),cs=b.chapters||[];
  const toc=cs.map((c,i)=>`<button class="toc-i ${ch&&ch.i===i?"cur":""}" data-a="rpage" data-p="${c.p}"><span>${esc(c.t)}</span><small>${c.p}${rp.ch&&rp.ch[i]?" · оқылды":""}</small></button>`).join("")||'<p class="muted">Тараулар анықталмаған.</p>';
  const res=R.res?(R.res.length?R.res.map(r=>`<button class="toc-i" data-a="rpage" data-p="${r.p}"><span>${r.s}</span><small>${r.p}-бет</small></button>`).join(""):'<p class="muted">Ештеңе табылмады.</p>'):'<p class="muted">Сөз, тұлға немесе тақырып атын енгіз.</p>';
  let body;
  if(R.loading)body='<p class="muted">Жүктелуде…</p>';
  else if(R.err)body=`<p class="err">${esc(R.err)}</p>`;
  else if(R.mode==="orig")body='<canvas id="pdfc" style="width:100%;max-width:100%"></canvas><p class="muted" id="pdfmsg"></p>';
  else{const t=((CH[R.id]||[])[R.page-1]||"").trim();body=t?t.split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join(""):'<p class="muted">Бұл бетте мәтін танылмаған. «Түпнұсқа бет» режимін қолдан.</p>'}
  const pct=Math.round(R.page/b.pages*100),read=Math.round((rp.max||1)/b.pages*100);
  out(`<main id="rd" class="rd"><div class="wrap"><div class="rd-card ${R.theme}">
  <div class="rd-top"><div><h2>${esc(b.title)}</h2><p>${b.grade}-сынып · ${esc(b.subject||"")}${b.authors?" · "+esc(b.authors):""}</p></div>
   <div class="rd-ctl"><button data-a="font" data-d="-1" aria-label="Қаріпті кішірейту" title="Қаріпті кішірейту">A−</button><button data-a="font" data-d="1" aria-label="Қаріпті үлкейту" title="Қаріпті үлкейту">A+</button><button data-a="lh" aria-label="Жол аралығы" title="Жол аралығы">↕ ${R.lh}</button><button data-a="night" aria-label="Түс тақырыбын ауыстыру">${R.theme==="night"?"Түнгі":R.theme==="sepia"?"Сепия":"Күндізгі"}</button><button data-a="ff" aria-label="Қаріп түрін ауыстыру">${R.ff==="serif"?"Aa Серіф":"Aa Қарапайым"}</button><button data-a="fav" data-b="${b.id}" aria-label="Таңдаулыға қосу">${(P.fav||{})[b.id]?"★":"☆"}</button><button data-a="fs">Толық экран</button><button data-a="go" data-v="library">Жабу</button></div></div>
  <div class="rd-prog"><span style="width:${pct}%"></span></div>
  <div class="rd-body"><aside class="rd-side ${R.toc?"open":""}"><h3>МАЗМҰНЫ</h3><div class="chips"><button class="chip" aria-pressed="${R.side==="toc"}" data-a="side" data-s="toc">Тараулар</button><button class="chip" aria-pressed="${R.side==="search"}" data-a="side" data-s="search">Іздеу</button></div>
   ${R.side==="search"?`<form data-f="rsearch"><input id="rq" type="search" value="${esc(R.q)}" placeholder="Сөз, тұлға, тақырып" aria-label="Кітаптан іздеу"></form><div>${res}</div>`:`<div>${toc}</div>`}</aside>
   <article class="page"><div class="rd-act"><button class="btn ghost sm rd-tocbtn" data-a="toc">Мазмұны</button><button class="btn ghost sm" data-a="rmode">${R.mode==="orig"?"Мәтін режимі":"Түпнұсқа бет"}</button><button class="btn ghost sm" data-a="markch">Тарауды оқылды деп белгілеу</button><span class="pill">Оқылды: ${read}%</span></div>
    <div class="deck"><button class="edge el" data-a="rnav" data-d="-1" aria-label="Алдыңғы бет" ${R.page<=1?"disabled":""}></button><button class="edge er" data-a="rnav" data-d="1" aria-label="Келесі бет" ${R.page>=b.pages?"disabled":""}></button><div class="sheet"><div class="sh-h"><span>${esc(b.title)}</span><span>${ch?esc(ch.t):esc(b.subject||"Оқулық")}</span></div>
    <div class="paper-b" style="font-size:${R.font}px;line-height:${R.lh};font-family:${R.ff==="serif"?"var(--display)":"var(--body)"}">${body}</div><div class="sh-f">— ${R.page} —</div></div></div>
    <div class="page-nav"><button class="btn sm" data-a="rnav" data-d="-1" ${R.page<=1?"disabled":""}>← Алдыңғы бет</button><span class="timer"><input id="pgin" type="number" min="1" max="${b.pages}" value="${R.page}" style="display:inline-block;width:5em;margin:0" aria-label="Бет нөмірі"> / ${b.pages}</span><button class="btn sm" data-a="rnav" data-d="1" ${R.page>=b.pages?"disabled":""}>Келесі бет →</button></div></article></div></div></div></main>`);
  window.scrollTo(0,0);
  const pi=$("#pgin");if(pi)pi.addEventListener("change",e=>rgo(+e.target.value||1));
  const pb=document.querySelector(".paper-b");if(pb){let x0=null,y0=null;pb.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});pb.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2)rgo(S.R.page+(dx<0?1:-1))},{passive:true})}
  if(R.mode==="orig"&&!R.loading)renderPdf();
}
function rgo(p){
  const b=bookById(S.R.id),old=document.querySelector(".sheet"),from=S.R.page;
  S.R.page=clamp(Math.round(p),1,b.pages);
  const dir=S.R.page>from?1:S.R.page<from?-1:0;
  track();vReader();
  if(!old||!dir||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const nw=document.querySelector(".sheet");if(!nw)return;
  const c=old.cloneNode(true),deck=nw.parentElement;
  if(dir>0){c.classList.add("flip","fn");deck.appendChild(c);setTimeout(()=>c.remove(),760)}
  else{c.classList.add("under");deck.insertBefore(c,nw);nw.classList.add("flip","fp");setTimeout(()=>{c.remove();nw.classList.remove("flip","fp")},760)}
}
async function getPdf(src){
  if(src.pdf)return src.pdf;
  if(!src.pdfUrl&&!src.pdfId)throw new Error("PDF жоқ");
  const key=src.id||"draft";
  if(!PDFS[key])PDFS[key]=pdfjsLib.getDocument({url:src.pdfUrl||("/_blob/"+src.pdfId)}).promise;
  return PDFS[key];
}

    const cw=Math.max(300,canvas.parentElement.clientWidth-8);const v0=pg.getViewport({scale:1});

function searchBook(q){
  const R=S.R,arr=CH[R.id]||[],ql=q.toLowerCase().trim(),res=[];
  if(!ql){R.res=null;return}
  for(let i=0;i<arr.length&&res.length<60;i++){const t=arr[i]||"",k=t.toLowerCase().indexOf(ql);if(k>=0){const s=t.slice(Math.max(0,k-30),k+ql.length+40).replace(/\s+/g," ");res.push({p:i+1,s:esc(s)})}}

}

/* ---------- admin: pdf processing ---------- */
function itemsToText(items){
  const lines=[];let cur="",lastY=null;
  for(const it of items){
    if(typeof it.str!=="string")continue;
    const y=it.transform?it.transform[5]:0;
    if(lastY!==null&&Math.abs(y-lastY)>3){lines.push(cur);cur=""}
    cur+=it.str;lastY=y;
    if(it.hasEOL){lines.push(cur);cur="";lastY=null}
  }
  if(cur)lines.push(cur);
  const L=lines.map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean);
  if(!L.length)return "";
  const mx=Math.max(...L.map(s=>s.length));
  let outp="",para="";
  L.forEach((s,i)=>{
    if(para&&/-$/.test(para)&&/^[a-zәіңғүұқөһ]/i.test(s))para=para.slice(0,-1)+s;else para+=(para?" ":"")+s;
    const endS=/[.!?:»”")]$/.test(s),short=s.length<mx*0.6;
    if(i===L.length-1||(short&&(endS||s.length<70))){outp+=(outp?"\n\n":"")+para;para=""}
  });
  if(para)outp+=(outp?"\n\n":"")+para;
  return outp;
}
async function outlineChapters(pdf){
  const out=[];
  try{
    const ol=await pdf.getOutline();if(!ol)return out;
    const walk=async(items,d)=>{for(const it of items){
      let dest=it.dest;if(typeof dest==="string")dest=await pdf.getDestination(dest);
      if(Array.isArray(dest)&&dest[0]){try{const idx=await pdf.getPageIndex(dest[0]);out.push({t:(it.title||"").trim(),p:idx+1,topic:""})}catch(e){}}
      if(d<1&&it.items&&it.items.length)await walk(it.items,d+1)}};
    await walk(ol,0);
  }catch(e){}
  return out.sort((a,b)=>a.p-b.p).filter((c,i,a)=>c.t&&(i===0||c.p!==a[i-1].p||c.t!==a[i-1].t));
}
function guessChapters(pages){
  const out=[];
  pages.forEach((t,i)=>{const l=(t||"").split("\n")[0].trim();if(l&&l.length<90&&/^(§\s*\d+|\d+\s*[-–.]?\s*(тарау|бөлім)|тарау|бөлім)/i.test(l))out.push({t:l,p:i+1,topic:""})});
  return out;
}
function analyze(pages){
  const w=[],n=pages.length,empty=[];
  pages.forEach((t,i)=>{if((t||"").trim().length<40)empty.push(i+1)});
  if(empty.length){w.push(`Мәтіні жоқ немесе өте аз ${empty.length} бет: ${empty.slice(0,25).join(", ")}${empty.length>25?"…":""}. Бұлар сканерленген бет, сурет немесе бос бет болуы мүмкін. OCR бұл жүйеде жоқ, мұндай беттер «Түпнұсқа бет» режимінде көрінеді.`)}
  if(n&&empty.length/n>0.3)w.push("Беттердің 30%-дан астамында мәтін жоқ. Бұл PDF сканерленген болуы мүмкін, мәтіндік режим толық жұмыс істемейді.");
  const all=pages.join(" "),letters=(all.match(/[A-Za-zА-Яа-яӘәІіҢңҒғҮүҰұҚқӨөҺһ]/g)||[]).length,cyr=(all.match(/[А-Яа-яӘәІіҢңҒғҮүҰұҚқӨөҺһ]/g)||[]).length;
  if(letters>200&&cyr/letters<0.4)w.push("Кириллица әріптері аз. Мәтін дұрыс танылмаған немесе кітап басқа тілде болуы мүмкін. Түзету қажет.");
  if((all.match(/\uFFFD/g)||[]).length>5)w.push("Танылмаған таңбалар (\uFFFD) табылды. Мәтінді түзет.");
  return w;
}
async function processPdf(file){
  const D=S.AD.d;
  if(typeof pdfjsLib==="undefined"){S.AD.msg="PDF кітапханасы жүктелмеді. Бетті жаңартып көр.";vAdmin();return}
  S.AD.busy=true;S.AD.msg="PDF ашылуда…";vAdmin();
  try{
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const n=pdf.numPages,pages=[];
    for(let i=1;i<=n;i++){
      const pg=await pdf.getPage(i),tc=await pg.getTextContent();
      pages.push(itemsToText(tc.items));
      if(i%5===0||i===n){const el=$("#padm");if(el)el.textContent=`Мәтін шығарылуда: ${i} / ${n}`}
    }
    D.pdf=pdf;D.file=file;D.pages=pages;D.cur=1;
    let ch=await outlineChapters(pdf);D.chSrc="PDF мазмұнынан алынды";
    if(!ch.length){ch=guessChapters(pages);D.chSrc="Тақырып жолдары бойынша болжанды. Тексеріп түзет."}
    if(!ch.length){ch=[{t:"Кітап мәтіні",p:1,topic:""}];D.chSrc="Тарау табылмады. Қолмен қос."}
    D.chapters=ch;D.warn=analyze(pages);
    try{
      const pg=await pdf.getPage(1),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:320/v0.width});
      const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
      await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      D.coverBlob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.8));
      D.coverPrev=c.toDataURL("image/jpeg",0.6);
    }catch(e){}
    S.AD.msg="PDF өңделді. Алдын ала қарап, түзет.";
  }catch(e){S.AD.msg="PDF өңдеу сәтсіз: "+(e&&e.message||e)}
  S.AD.busy=false;vAdmin();
}

function vsPlayBeat(){
  const V=S.VP;clearTimeout(V.tm);const tok=++V.tok;
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  const sc=V.sc[V.i],txt=sc.beats[V.b],ms=vsDur(V,sc,txt);
  const adv=()=>{if(V.tok!==tok||!V.playing)return;clearTimeout(V.tm);vsNext()};
  if(sc.type==="think"){vsSay(txt,null);V.tm=setTimeout(adv,ms);return}
  if(vsSay(txt,adv)){V.tm=setTimeout(adv,ms*3+3000);return}
  V.tm=setTimeout(adv,ms);
}
function vsAdv(){
  const V=S.VP,sc=V.sc[V.i];
  if(V.b<sc.beats.length-1){V.b++;return true}
  if(V.i<V.sc.length-1){V.i++;V.b=0;return true}
  return false;
}
function vsNext(){
  const V=S.VP;
  if(!vsAdv()){V.playing=false;V.over=true;vsStop();vsDraw();return}
  if(V.sc[V.i].type==="q"&&V.playing){V.playing=false;vsStop()}
  vsDraw();if(V.playing)vsPlayBeat();
}
function vsPrev(){
  const V=S.VP;
  if(V.b>0)V.b--;else if(V.i>0){V.i--;V.b=0}
  vsDraw();if(V.playing)vsPlayBeat();
}
document.addEventListener("click",e=>{const dl=e.target.closest(".dr-nav [data-a=lesson]");if(dl)setTimeout(()=>{try{closeUI()}catch(z){}},0)},true);
document.addEventListener("click",e=>{
  const x=e.target.closest("[data-a]");if(!x||!S.VP&&x.dataset.a!=="lsmode")return;
  const a=x.dataset.a,V=S.VP;
  if(a==="lsmode"){e.preventDefault();vsStop();S.LS.mode=x.dataset.m;if(x.dataset.s)S.LS.s=+x.dataset.s;vLesson();return}
  if(S.view!=="lesson"||!V||!$("#vsstage"))return;
  if(a==="vsplay"){
    e.preventDefault();
    if(V.over){V.i=0;V.b=0;V.over=false}
    
    V.started=true;
    if(!V.playing&&V.sc[V.i].type==="q"&&V.sc[V.i].ans===null)vsAdv();
    V.playing=!V.playing;
    if(V.playing&&V.sc[V.i].type==="q")V.playing=false;
    if(V.playing)vsPlayBeat();else vsStop();
    vsDraw();
  }
  else if(a==="vsmus"){e.preventDefault();V.music=(V.music===false);if(V.music===false)vsMusicStop();vsDraw()}
  else if(a==="vscont"){e.preventDefault();V.started=true;if(vsAdv()){V.playing=true;vsDraw();vsPlayBeat()}else{V.over=true;vsDraw()}}
  else if(a==="vsans"){e.preventDefault();const sc=V.sc[V.i];if(sc.type==="q"&&sc.ans===null){sc.ans=+x.dataset.o;if(sc.ans===sc.ci){P.points+=2}recMist(sc.beats[0],sc.opts,sc.ci,sc.e,V.tid,sc.ans===sc.ci);saveP();vsDraw()}}
  else if(a==="vsreplay"){e.preventDefault();V.sc.forEach(s=>{if(s.type==="q")s.ans=null});V.i=0;V.b=0;V.over=false;V.started=true;V.playing=true;vsDraw();vsPlayBeat()}
  else if(a==="vsnext"){e.preventDefault();V.started=true;vsNext()}
  else if(a==="vsprev"){e.preventDefault();V.started=true;vsPrev()}
  else if(a==="vsseek"){e.preventDefault();V.started=true;V.i=+x.dataset.n;V.b=0;V.over=false;if(V.sc[V.i].type==="q")V.playing=false;vsDraw();if(V.playing)vsPlayBeat()}
  else if(a==="vsspeed"){e.preventDefault();const o=[0.75,1,1.25,1.5,2];V.speed=o[(o.indexOf(V.speed)+1)%o.length];vsDraw();if(V.playing)vsPlayBeat()}
  else if(a==="vsvoice"){e.preventDefault();V.voice=!V.voice;if(!window.speechSynthesis)V.voice=false;vsDraw();if(V.playing)vsPlayBeat()}
  else if(a==="vsfs"){e.preventDefault();const el=document.querySelector(".vs-main");try{if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen().catch(()=>{})}catch(z){}}
});

function saveWeek(T,pct){
  const k=T.wk,r=P.wk[k]=P.wk[k]||{best:0,att:0,passed:false,hist:[]};
  const by={};T.ans.forEach(a=>{const b=by[a.tid]=by[a.tid]||[0,0];b[1]++;if(a.ok)b[0]++});
  const ok=pct>=T.pass;
  r.att=(r.att||0)+1;r.last=pct;r.best=Math.max(r.best||0,pct);if(ok)r.passed=true;
  r.hist=(r.hist||[]).concat({d:new Date().toLocaleDateString("kk-KZ"),pct,s:T.ans.filter(a=>a.ok).length,n:T.ans.length,ok,by}).slice(-20);
  T.weekOk=ok;
  if(DB&&UID&&CANWRITE)DB.doc("wkres/"+UID+"_"+k).set({uid:UID,name:P.name||"",grade:P.grade,week:k,best:r.best,last:pct,att:r.att,passed:!!r.passed,t:Date.now()}).catch(()=>{});
}
function wkHist(){

}

async function saveWeekDoc(){
  const W=S.AD.w;
  if(!DB){S.AD.msg="Дерекқор қолжетімсіз.";return vAdmin()}
  if(W.n<1){S.AD.msg="Апта нөмірін енгіз.";return vAdmin()}
  if(!W.topics.length){S.AD.msg="Кемінде бір сабақ таңда.";return vAdmin()}
  S.AD.busy=true;S.AD.msg="Сақталуда…";vAdmin();
  try{
    const id=W.id||DB.collection("weeks").doc().id;
    await DB.doc("weeks/"+id).set({grade:0,subject:SUBJ[0],n:+W.n,title:W.title.trim(),topics:W.topics,qCount:clamp(+W.qCount||25,5,60),pass:clamp(+W.pass||70,1,100),status:W.status,updated:Date.now()});

  }catch(e){S.AD.msg="Сақтау қатесі: "+(e&&(e.message||e.code)||e)}
  S.AD.busy=false;vAdmin();
}

init();


const AS={h:[],busy:false,sm:null};
function asCtx(){const t=(S.view==="lesson"&&TOPIC[S.lessonId])||null;return t?`Қазіргі сабақ: ${t.title}. Негізгі ойлар: ${t.k.join(" ")} Даталар: ${t.dates.map(d=>d[0]+" — "+d[1]).join("; ")}. Тұлғалар: ${t.people.map(p=>p[0]+" — "+p[1]).join("; ")}.`:"Оқушы қазір белгілі бір сабақ ашқан жоқ."}
function asDraw(live){const m=document.getElementById("asm");if(!m)return;m.innerHTML=AS.h.map(x=>`<div style="margin:6px 0;text-align:${x.r==="user"?"right":"left"}"><span style="display:inline-block;max-width:90%;padding:8px 11px;border-radius:12px;background:${x.r==="user"?"#d4af37":"#16408f"};color:${x.r==="user"?"#0a1f4d":"#fff"};text-align:left">${esc(x.t).replace(/\n/g,"<br>")}</span></div>`).join("")+(live?`<div style="opacity:.7">Тарих жазып жатыр…</div>`:"");m.scrollTop=m.scrollHeight}
async function asSend(txt){
  txt=(txt||"").trim();if(!txt||!AS.sm)return;if(AS.busy){const m=document.getElementById("asm");if(m)m.insertAdjacentHTML("beforeend","<div style=\"opacity:.7\">Алдыңғы жауап жазылып жатыр, сәл күте тұр…</div>");return}AS.busy=true;AS.h.push({r:"user",t:txt});asDraw(true);
  const pre="Сен «Тарих» деген, ҰБТ-ға дайындалатын оқушыға арналған қазақша тарих көмекшісісің. Тек Қазақстан тарихы туралы, қазақ тілінде, қысқа әрі түсінікті жауап бер, жұлдызша мен markdown белгілерін қолданба. Төмендегі сабақ материалына сүйен; онда жоқ нақты дата мен есімді ойдан шығарма, сенімсіз болсаң оқулықпен тексер деп айт. Оқушы түсінбесе, қарапайым мысалмен қайта түсіндір. "+asCtx();
  let hh=AS.h.filter(x=>!x.g).slice(-7);while(hh.length&&hh[0].r!=="user")hh.shift();const msgs=hh.map((m,i)=>({role:m.r,content:(i===0?pre+"\n\nОқушы: ":"")+m.t}));
  try{const r=await AS.sm(msgs,{cache:false,modelTier:"quick",onText:({text})=>{const m=document.getElementById("asm");if(m){m.lastElementChild&&(m.lastElementChild.textContent=text)}}});AS.h.push({r:"assistant",t:(r.text||"").trim()||"Жауап шықпады."})}
  catch(e){const k=e&&e.code,M={not_granted:"Көмекшіге Claude қолдануға рұқсат берілмеді. Бетті қайта ашып, рұқсат ет.",sampling_disabled:"Бұл аккаунтта Claude қолжетімсіз.",rate_limited:"Сұрау тым көп немесе лимит біткен. Сәл күтіп, қайта сұра.",session_expired:"Claude аккаунтына қайта кіру керек.",invalid_request:"Сұраныс қате құрылды (код: invalid_request)."};AS.h.push({r:"assistant",t:M[k]||"Қазір жауап ала алмадым"+(k?" (код: "+k+")":"")+". Кейінірек қайталап көр."})}
  AS.busy=false;asDraw(false);
}
async function asInit(){
  const sm=await cap("sample");if(!sm||document.getElementById("asb"))return;AS.sm=sm;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition,q=[["Конспект жаса","Осы сабақтың қысқа конспектін жаса: даталар, тұлғалар, ҰБТ-ға керек фактілер."],["Түсіндір","Осы тақырыпты қарапайым тілмен түсіндір."],["Сұрақ қой","Осы тақырып бойынша 3 қысқа сұрақ қой, мен жауап жазғанша жауабын айтпа."],["Түсінбедім","Мен осы тақырыпты түсінбедім. Қарапайым мысалмен басынан түсіндір."]];
  document.body.insertAdjacentHTML("beforeend",`<button id="asb" aria-label="Тарих көмекшісі" style="position:fixed;right:14px;bottom:14px;z-index:60;background:#d4af37;color:#0a1f4d;border:0;border-radius:28px;padding:12px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer">Тарих</button>
  <div id="asp" style="display:none;position:fixed;right:14px;bottom:70px;z-index:61;width:min(380px,calc(100vw - 28px));height:min(520px,70vh);flex-direction:column;background:#0d2a63;color:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.4);border:1px solid #d4af37;padding:12px"><b style="color:#d4af37">Тарих — оқу көмекшісі</b><div id="asm" style="flex:1;overflow:auto;margin:8px 0"></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${q.map((x,i)=>`<button data-asq="${i}" style="background:transparent;color:#f2d27a;border:1px solid #d4af37;border-radius:14px;padding:4px 10px;cursor:pointer">${x[0]}</button>`).join("")}</div><div style="display:flex;gap:6px"><input id="asi" placeholder="Сұрағыңды жаз…" style="flex:1;min-width:0;padding:8px;border-radius:8px;border:0">${SR?'<button id="asv" aria-label="Дауыспен сұрау" style="border:0;border-radius:8px;padding:8px 10px;cursor:pointer">🎤</button>':""}<button id="ass" style="background:#d4af37;color:#0a1f4d;border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer">Жіберу</button></div></div>`);
  const P_=document.getElementById("asp"),I=document.getElementById("asi");
  document.getElementById("asb").onclick=()=>{const o=P_.style.display==="none";P_.style.display=o?"flex":"none";if(o){if(!AS.h.length){AS.h.push({r:"assistant",g:true,t:"Сәлем! Мен Тарихпын. Қай тақырыпқа көмектесейін: түсіндірейін бе, конспект жасайын ба, әлде сұрақ қояйын ба?"})}asDraw(false);I.focus()}};
  document.getElementById("ass").onclick=()=>{const v=I.value;I.value="";asSend(v)};
  I.onkeydown=e=>{if(e.key==="Enter"){const v=I.value;I.value="";asSend(v)}};
  P_.querySelectorAll("[data-asq]").forEach(b=>b.onclick=()=>asSend(q[+b.dataset.asq][1]));
  const mic=document.getElementById("asv");
  if(mic)mic.onclick=()=>{try{const r=new SR();r.lang="kk-KZ";r.onresult=ev=>{let v=ev.results[0][0].transcript.replace(/^\s*тарих[\s,.!]*/i,"");asSend(v||"Маған көмектес")};r.start()}catch(e){}};
}
setTimeout(asInit,1200);
</script>


</body></html>
